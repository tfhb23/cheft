# Render.com Blueprint: ein kostenloser Web Service für App + Mehrspieler-Server.
services:
  - type: web
    name: cheft
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Schlüssel für die verschlüsselten Spielstand-Kopien (wird beim ersten Deployment erzeugt und bleibt gleich).
      - key: CHEFT_SECRET
        generateValue: true
